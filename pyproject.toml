[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "envtok"
version = "0.1.0a2"
description = "Interpretable local-environment tokens and coverage-guaranteed subset selection for atomistic datasets."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = [
  "atomistic",
  "chemenv",
  "dataset curation",
  "machine-learned interatomic potentials",
  "materials",
  "subset selection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "ase>=3.27.0",
  "duckdb>=2.0.0",
  "numpy>=2.3.3",
  "pyarrow>=22.0.0",
  "pymatgen>=2026.9.23",
  "pyyaml>=6.0.3",
  "spglib>=2.7.0",
  "typing-extensions>=4.4.0",
]

[project.optional-dependencies]
# Reads OMat24 ASE-LMDB shards without the fairchem/torch stack.
omat24 = ["ase-db-backends>=0.11.0", "lmdb>=1.7.5"]
# Finite-molecule graph perception and local continuous SOAP descriptors.
molecular = ["rdkit>=2026.9.1", "dscribe>=2.1.2"]

[project.scripts]
envtok = "envtok.cli:main"

[project.urls]
Homepage = "https://github.com/SMTG-Bham/py-envtok"
Issues = "https://github.com/SMTG-Bham/py-envtok/issues"
Repository = "https://github.com/SMTG-Bham/py-envtok"

[dependency-groups]
dev = [
  { include-group = "test" },
  "mypy>=2.4.0",
  "prek>=0.5.5",
  "ruff>=0.16.10",
  "types-pyyaml>=6.0.12",
]
test = [
  "ase-db-backends>=0.11.0",
  "lmdb>=1.7.5",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[tool.pytest]
minversion = "9.1"
addopts = ["-ra", "--import-mode=importlib", "--cov", "--cov-report=term-missing"]
testpaths = ["tests"]
pythonpath = ["tests"]
strict = true
filterwarnings = [
  "error",
  # ASE's SQLite backend leaves connections to the garbage collector.
  "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
  # dscribe docstrings contain invalid escapes that warn when the module is
  # first compiled: DeprecationWarning before Python 3.12, SyntaxWarning after.
  # Compile-time warnings report the source path as their module.
  'ignore:.*invalid escape sequence:DeprecationWarning:(.*[/\\])?dscribe[./\\]',
  'ignore:.*invalid escape sequence:SyntaxWarning:(.*[/\\])?dscribe[./\\]',
]

[tool.coverage.run]
branch = true
source_pkgs = ["envtok"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  'if __name__ == "__main__":',
  'if TYPE_CHECKING:',
  '\.\.\.$',
]

[tool.ruff]
extend-exclude = ["build_tools/reference/vendored_*.py"]
force-exclude = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "ERA",  # eradicate
  "EXE",  # flake8-executable
  "F",    # Pyflakes
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "NPY",  # NumPy-specific rules
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "T10",  # flake8-debugger
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "YTT",  # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D1",      # docstrings are welcome in tests but not required
  "INP001",  # pytest's importlib mode does not need tests/__init__.py
  "PLR2004", # literal expected values are clearer in assertions
  "S101",    # pytest uses bare assert statements
  "SLF001",  # tests may inspect private helpers
]
# SQL is assembled from internal identifiers and sql_literal-quoted paths only.
"src/envtok/{store/cache,coarsen,report,selection/incidence}.py" = ["S608"]
# The reference oracle mirrors upstream code structure and SQL verbatim.
"tests/reference_oracles.py" = ["C901", "E501", "PLR0912", "PLR0914", "PLR0915", "S608"]
"examples/**" = [
  "INP001",  # standalone example scripts
  "T201",    # examples print their results
]
"build_tools/**" = [
  "INP001",  # standalone scripts, not a package
  "T201",    # scripts report progress with print
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
pretty = true
# ASE and pymatgen ship py.typed but are largely unannotated.
untyped_calls_exclude = ["ase", "pymatgen", "spglib"]

[[tool.mypy.overrides]]
# Scientific dependencies without usable type information.
module = [
  "ase.*",
  "ase_db_backends.*",
  "fairchem.*",
  "pyarrow.*",
  "pymatgen.*",
  "spglib.*",
]
ignore_missing_imports = true
follow_untyped_imports = false
