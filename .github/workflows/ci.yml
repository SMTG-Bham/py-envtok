name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the project
        run: uv sync --locked

      - name: Run the pre-commit hooks
        run: uv run --locked prek run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run --locked mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.resolution }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Python 3.15 and the free-threaded 3.14t build are not tested:
        # pymatgen-core (required for ChemEnv) publishes no wheels for them.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # "lowest-direct" tests the oldest dependency versions allowed by
        # pyproject.toml.
        resolution: [locked, lowest-direct]
        extras: [base]
        include:
          - python-version: "3.11"
            resolution: locked
            extras: molecular
          - python-version: "3.12"
            resolution: locked
            extras: molecular
          - python-version: "3.13"
            resolution: locked
            extras: molecular
          - python-version: "3.14"
            resolution: locked
            extras: molecular

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with the locked dependencies
        if: matrix.resolution == 'locked' && matrix.extras == 'base'
        run: uv run --locked --no-default-groups --group test pytest

      - name: Test the real molecular descriptor backends
        if: matrix.extras == 'molecular'
        run: |
          uv run --locked --extra molecular --no-default-groups --group test python -c "from dscribe.descriptors import SOAP; from rdkit import Chem"
          uv run --locked --extra molecular --no-default-groups --group test pytest

      - name: Qualify the bundled real periodic sample
        if: matrix.resolution == 'locked' && matrix.extras == 'base'
        run: |
          uv run --locked --no-default-groups --group test python build_tools/qualify_periodic.py \
            --source examples/omat24/small-sample/train.aselmdb \
            --revision local-1M-shard-d7be82771964f041 \
            --source-provenance examples/omat24/small-sample/provenance.json \
            --output "$RUNNER_TEMP/periodic-qualification.json"

      - name: Qualify the bundled molecular workflow
        if: matrix.extras == 'molecular'
        run: |
          uv run --locked --extra molecular --no-default-groups --group test python build_tools/qualify_molecular.py \
            --output "$RUNNER_TEMP/molecular-qualification.json"

      - name: Test with the oldest allowed dependencies
        if: matrix.resolution == 'lowest-direct'
        run: uv run --resolution lowest-direct --no-default-groups --group test pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the sdist and wheel
        run: uv build --no-sources

      - name: Qualify wheel and sdist in fresh dependency environments
        run: python build_tools/qualify_artifacts.py

  all-green:
    name: All checks passed
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fail if any required job did not succeed
        if: needs.lint.result != 'success' || needs.test.result != 'success' || needs.build.result != 'success'
        run: exit 1
