name: Release

# Publishes to PyPI with trusted publishing when a GitHub release is published.
# Before the first release, add this repository as a trusted publisher on PyPI
# and create a "pypi" environment in the repository settings.

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  checks:
    name: Qualify the release revision
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and qualify distributions
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
          python-version: "3.14"

      - name: Check the tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: uv build --no-sources

      - name: Qualify the distributions that will be published
        run: python build_tools/qualify_artifacts.py --output "$RUNNER_TEMP/artifact-qualification.json"

      - name: Upload the artifact qualification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-qualification
          path: ${{ runner.temp }}/artifact-qualification.json
          if-no-files-found: error

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/envtok/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
